<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智帳｜消費分析</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#252b42;background:#f6f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:32px 18px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px}h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 15px}p{color:#70768c;margin:5px 0}.tag{background:#ede9fe;color:#7354b8;padding:8px 12px;border-radius:30px;font-size:13px}.top{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid #ebedf5;border-radius:18px;padding:22px;box-shadow:0 6px 20px #242b4410}.metric{font-size:30px;font-weight:800;margin-top:12px}.sub{font-size:13px;color:#84899a}.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.wide{grid-column:1/-1}label{font-size:13px;font-weight:650;display:block;margin:12px 0 5px}input,select{width:100%;padding:12px;border:1px solid #dfe2ec;border-radius:9px;font:inherit;background:#fff}button{background:#7355be;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer;margin-top:14px}button.secondary{background:#f0edfa;color:#624baa}button.danger{margin:0;padding:7px 11px;background:#fff1f1;color:#b84554}.row{display:flex;align-items:center;gap:12px}.row>*{flex:1}.chartrow{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:13px}.chartrow .name{width:42px;flex-shrink:0}.barbg{flex:1;background:#eeeaf8;border-radius:30px;height:13px;overflow:hidden}.bar{background:linear-gradient(90deg,#a894e6,#7555be);height:100%;border-radius:30px}.chartrow .amount{width:90px;text-align:right}.progress{height:14px;background:#eeeaf8;border-radius:30px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#8c73d4}.insight{padding:12px 14px;margin:9px 0;border-radius:10px;background:#f5f1ff;color:#4d3d78;font-size:14px}.muted{font-size:13px;color:#858a9b}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.headrow button{margin:0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px 7px;border-bottom:1px solid #eee}th{color:#788095}#msg{margin-top:10px;color:#4c3d7b;min-height:20px}.empty{padding:20px;text-align:center;color:#8a90a0}.scroll{overflow:auto}@media(max-width:700px){.top,.main{grid-template-columns:1fr}.wide{grid-column:auto}.metric{font-size:25px}header{align-items:flex-start}h1{font-size:23px}}
</style></head><body><div class="wrap"><header><div><h1>✦ 智帳 Smart Expense</h1><p>讓每一筆花費都更清楚</p></div><span class="tag">智慧分類 · 在地保存</span></header>
<div class="headrow" style="margin-bottom:16px"><strong>消費總覽</strong><input style="max-width:190px" id="month" type="month"></div>
<div class="top"><section class="card"><div class="sub">本月總支出</div><div class="metric" id="total">NT$0</div><div class="sub" id="count">共 0 筆紀錄</div></section><section class="card"><div class="sub">本月預算</div><div class="metric" id="budgetText">尚未設定</div><div class="progress"><div class="fill" id="progress"></div></div><div class="sub" id="remaining">設定預算後顯示使用比例</div></section><section class="card"><div class="sub">上月總支出</div><div class="metric" id="prev">NT$0</div><div class="sub">與前一完整月份的金額比較</div></section></div>
<div class="main"><section class="card"><h2>新增支出</h2><form id="form"><div class="row"><div><label>消費日期</label><input type="date" id="day" required></div><div><label>金額（元）</label><input type="number" id="amount" min="1" max="100000000" step="1" placeholder="例如 120" required></div></div><label>消費內容</label><input id="note" maxlength="100" placeholder="例如：午餐便當、捷運、Netflix" required><label>智慧建議分類（可手動修改）</label><select id="category"></select><button type="submit">＋ 儲存這筆消費</button><div id="msg" role="status"></div></form></section>
<section class="card"><h2>每月預算與消費建議</h2><label>本月預算（元）</label><div class="row"><input id="budgetInput" type="number" min="1" step="1" placeholder="例如 12000"><button id="saveBudget" style="flex:0 0 auto;margin:0">設定預算</button></div><h2 style="margin-top:24px">智慧分析</h2><div id="insights" class="muted">新增支出後顯示分析建議</div><p class="muted" style="margin-top:16px">※ 分類使用可解釋的關鍵字規則，並非訓練型 AI；不會將消費資料傳送到外部服務。</p></section>
<section class="card"><h2>分類支出分析</h2><div id="chart" class="empty">目前沒有資料</div></section><section class="card"><h2>每日消費趨勢</h2><div id="daily" class="empty">目前沒有資料</div></section>
<section class="card wide"><div class="headrow"><h2>支出明細</h2><button class="secondary" id="export">匯出本月 CSV</button></div><div class="scroll"><table><thead><tr><th>日期</th><th>消費內容</th><th>分類</th><th>金額</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></div>
<script>
const $=id=>document.getElementById(id),money=n=>'NT$'+Number(n).toLocaleString('zh-TW'),cats=['餐飲','交通','購物','居家','娛樂','醫療','教育','其他'];
$('category').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');const now=new Date();const local=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString();$('day').value=local.slice(0,10);$('month').value=local.slice(0,7);
async function req(url,data){let r=await fetch(url,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'操作失敗');return j}
async function refresh(){try{const s=await req('/api/summary?month='+$('month').value);$('total').textContent=money(s.total);$('count').textContent=`共 ${s.count} 筆紀錄`;$('prev').textContent=money(s.previous_total);$('budgetText').textContent=s.budget?money(s.budget):'尚未設定';$('budgetInput').value=s.budget||'';$('progress').style.width=s.budget?Math.min(100,s.total/s.budget*100)+'%':'0%';$('remaining').textContent=s.budget?`已使用 ${(s.total/s.budget*100).toFixed(1)}% · ${s.remaining>=0?'剩餘':'超出'} ${money(Math.abs(s.remaining))}`:'設定預算後顯示使用比例';
const colors=Object.entries(s.categories).filter(([c,v])=>v>0);$('chart').innerHTML=colors.length?colors.map(([c,v])=>`<div class="chartrow"><span class="name">${c}</span><div class="barbg"><div class="bar" style="width:${v/s.total*100}%"></div></div><span class="amount">${money(v)}</span></div>`).join(''):'<div class="empty">本月尚無消費紀錄</div>';
const max=Math.max(...s.daily.map(x=>x.amount),1);$('daily').innerHTML=s.daily.length?s.daily.map(x=>`<div class="chartrow"><span class="name" style="width:55px">${x.date.slice(5)}</span><div class="barbg"><div class="bar" style="width:${x.amount/max*100}%"></div></div><span class="amount">${money(x.amount)}</span></div>`).join(''):'<div class="empty">本月尚無趨勢資料</div>';
$('insights').innerHTML=s.insights.length?s.insights.map(v=>`<div class="insight">${escapeHtml(v)}</div>`).join(''):'<div class="muted">先新增消費，或設定預算，即可查看提醒。</div>';
$('rows').innerHTML=s.items.length?s.items.map(x=>`<tr><td>${x.spend_date}</td><td>${escapeHtml(x.note)}</td><td>${x.category}</td><td>${money(x.amount)}</td><td><button class="danger" data-id="${x.id}">刪除</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">尚無紀錄，先新增第一筆吧！</td></tr>';
}catch(e){alert(e.message)}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
$('note').addEventListener('input',async()=>{const v=$('note').value;try{const x=await req('/api/predict',{note:v});if($('note').value===v)$('category').value=x.category}catch(e){}});
$('form').addEventListener('submit',async e=>{e.preventDefault();try{await req('/api/expense',{date:$('day').value,amount:Number($('amount').value),note:$('note').value,category:$('category').value});$('note').value='';$('amount').value='';$('category').value='其他';$('msg').textContent='已儲存成功';refresh()}catch(e){$('msg').textContent=e.message}});
$('saveBudget').onclick=async()=>{try{await req('/api/budget',{month:$('month').value,amount:Number($('budgetInput').value)});refresh()}catch(e){alert(e.message)}};
$('month').onchange=refresh;$('export').onclick=()=>{location.href='/api/export?month='+$('month').value};$('rows').onclick=async e=>{const b=e.target.closest('[data-id]');if(!b)return;if(!confirm('確定刪除這筆消費？'))return;try{await req('/api/delete',{id:Number(b.dataset.id)});refresh()}catch(e){alert(e.message)}};refresh();
</script></body></html>
