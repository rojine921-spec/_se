<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>模擬大學校務系統</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="{{ url_for('index') }}">🎓 Campus Portal <small>模擬校務系統</small></a>{% if g.user %}<nav><a href="{{ url_for('dashboard') }}">首頁</a><a href="{{ url_for('courses') }}">開課查詢</a>{% if g.user['role']=='student' %}<a href="{{ url_for('my_courses') }}">我的選課</a><a href="{{ url_for('grades') }}">成績查詢</a>{% else %}<a href="{{ url_for('admin') }}">成績管理</a>{% endif %}</nav><form method="post" action="{{ url_for('logout') }}"><button class="outline small">登出</button></form>{% endif %}</div></header>
<main class="wrap"><div class="messages">{% for category, message in get_flashed_messages(with_categories=true) %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}</div>{% block content %}{% endblock %}</main><footer>課堂練習專案｜所有姓名、帳號與課程都是虛構測試資料｜不可直接用於真實校務服務</footer></body></html>
